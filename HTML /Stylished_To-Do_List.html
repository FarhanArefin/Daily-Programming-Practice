<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <ul class="todo-list">
        <li>
            <input id="task_1" type="checkbox"></input>
            <label for="task_1">Explore gaming keyboards</label>
            <ul class="sub-item">
                <li>
                    <a href="#" target="_blank" class="sub-item-link">Store link</a>
                </li>
            </ul>
        </li>
        <li>
            <input id="task_2" type="checkbox"></input>
            <label for="task_2">Finish the report</label>
            <ul class="sub-item">
                <li>
                    <a href="#" target="_blank" class="sub-item-link">Request Access</a>
                </li>
            </ul>
        </li>
        <li>
            <input id="task_3" type="checkbox"></input>
            <label for="task_3">View Phone's Warranty</label>
            <ul class="sub-item">
                <li>
                    <a href="#" target="_blank" class="sub-item-link">View Receipts</a>
                </li>
            </ul>
        </li>
        <li>
            <input id="task_4" type="checkbox"></input>
            <label for="task_4">Check Processor Specs</label>
            <ul class="sub-item">
                <li>
                    <a href="#" target="_blank" class="sub-item-link">View Model Number</a>
                </li>
            </ul>
        </li>
    </ul>

</body>

</html>
